name: build

on:
  push:
    branches:
      - main

  pull_request:

  merge_group:

  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # the scheduled builds only pick up new releases, the code is already linted
    if: github.event_name != 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@065c7cd31765ae2015249a42ec1e3798e462b5d4 # v5.3.1
        with:
          save-cache: true

      - name: lint
        run: pnpm lint

      - name: Install the workflow linters
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
    # also run when lint was skipped on schedule
    if: ${{ !cancelled() && !failure() }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: binary-builder
        uses: containerbase/internal-tools@065c7cd31765ae2015249a42ec1e3798e462b5d4 # v5.3.1
        with:
          command: binary-builder
          dry-run: ${{github.ref_name != 'main'}}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    concurrency:
      group: publish
      cancel-in-progress: true

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Deploy release list to GitHub Pages
        id: deployment
        uses: containerbase/internal-tools/publish-releases@065c7cd31765ae2015249a42ec1e3798e462b5d4 # v5.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
