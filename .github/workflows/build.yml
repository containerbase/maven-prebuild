name: build

on:
  push:
    branches:
      - main

  pull_request:

  merge_group:

  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  # don't cancel a running release or deployment on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # the scheduled builds only pick up new releases, the code is already linted
    if: github.event_name != 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # shellcheck annotations
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@1698c4ef152816bca85a99396348e5ec4ed054de # v5.3.7
        with:
          save-cache: true

      - name: lint
        run: pnpm lint

      - name: Install the workflow linters
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: shellcheck
        if: ${{ github.event_name != 'merge_group' }}
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          fail_level: any
          reporter: github-pr-annotations
          filter_mode: nofilter
          path: |
            bin
            .husky
          pattern: |
            *.sh
          exclude: |
            ./.git/*
            ./.husky/_/*
          check_all_files_with_shebangs: 'true'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs:
      - lint
    # also run when lint was skipped on schedule
    if: ${{ !cancelled() && !failure() }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: binary-builder
        uses: containerbase/internal-tools@1698c4ef152816bca85a99396348e5ec4ed054de # v5.3.7
        with:
          command: binary-builder
          dry-run: ${{github.ref_name != 'main'}}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: publish
      # let a running deployment finish
      cancel-in-progress: false

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Deploy release list to GitHub Pages
        id: deployment
        uses: containerbase/internal-tools/publish-releases@1698c4ef152816bca85a99396348e5ec4ed054de # v5.3.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
